<div class="p-6">
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-800 dark:text-white">Nueva Cita</h1>
    <p class="text-gray-600 dark:text-gray-400">Programa una cita para un paciente</p>
  </div>

  @if (errorMessage()) {
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
      {{ errorMessage() }}
    </div>
  }

  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label class="font-medium text-gray-700 dark:text-gray-300">Paciente</label>
          <p-select [options]="patients()" formControlName="patient_id" optionLabel="first_name" optionValue="id" placeholder="Seleccione un paciente" styleClass="w-full"></p-select>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-medium text-gray-700 dark:text-gray-300">Médico</label>
          <p-select [options]="doctors()" formControlName="doctor_id" optionLabel="user.name" optionValue="id" placeholder="Seleccione un médico" styleClass="w-full"></p-select>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label class="font-medium text-gray-700 dark:text-gray-300">Fecha</label>
          <p-datepicker formControlName="date" dateFormat="yy-mm-dd" [showIcon]="true" styleClass="w-full"></p-datepicker>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-medium text-gray-700 dark:text-gray-300">Hora</label>
          <p-datepicker formControlName="time" [timeOnly]="true" hourFormat="24" [showIcon]="true" icon="pi pi-clock" styleClass="w-full"></p-datepicker>
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <label class="font-medium text-gray-700 dark:text-gray-300">Notas / Motivo</label>
        <textarea pInputTextarea formControlName="notes" rows="4" class="w-full"></textarea>
      </div>

      <div class="flex justify-end mt-4">
        <p-button label="Agendar Cita" type="submit" [disabled]="form.invalid"></p-button>
      </div>
    </form>
  </div>
</div>
